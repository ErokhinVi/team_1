<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=414,initial-scale=1" />
  <title>Райф · мобильный банк · проверка связи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f6f3ec;
      --surface:   #ffffff;
      --rule:      #e3ddcc;
      --text:      #1f1d18;
      --text-2:    #5a564c;
      --muted:     #8a857a;
      --raiff:     #FFE600;
      --raiff-soft:#fff7a0;
      --good:      #2f7a3a;
      --warn:      #a4662d;
      --bad:       #b14b32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Geist", -apple-system, system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    .phone {
      max-width: 420px; margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      box-shadow: 0 0 60px rgba(60,52,40,0.08);
    }
    .topbar {
      background: var(--text); color: var(--bg);
      padding: 28px 22px 16px;
    }
    .topbar .logo {
      width: 26px; height: 26px;
      background: var(--raiff); display: inline-block;
      border-radius: 4px; vertical-align: middle;
      margin-right: 10px;
    }
    .topbar .name {
      font-weight: 500; font-size: 16px; vertical-align: middle;
    }
    .topbar .who {
      font-size: 12px; color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .balance {
      padding: 26px 22px 22px;
      background: linear-gradient(180deg, var(--text) 0%, #2c2823 100%);
      color: var(--bg);
    }
    .balance .l {
      font-size: 11px; opacity: 0.6;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .balance .v {
      font-size: 32px; font-weight: 500; margin-top: 6px;
      letter-spacing: -0.01em;
    }
    .balance .v .cur { font-size: 18px; opacity: 0.7; margin-left: 4px; }

    .tabs {
      display: flex; gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      position: sticky; top: 0; z-index: 5;
    }
    .tabs button {
      flex: 1;
      padding: 14px 8px;
      background: transparent; border: 0;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--text-2);
      cursor: pointer; position: relative;
      transition: color 160ms;
    }
    .tabs button.active { color: var(--text); }
    .tabs button.active::after {
      content: ""; position: absolute;
      left: 24%; right: 24%; bottom: 0;
      height: 2px; background: var(--text);
    }

    .tab-pane { display: none; padding: 22px; }
    .tab-pane.show { display: block; }

    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin: 6px 0 10px;
    }

    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 12px;
      color: var(--text-2); margin-bottom: 4px;
    }
    .form-row input, .form-row select {
      width: 100%; padding: 10px 12px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--rule); border-radius: 6px;
      font-family: inherit; font-size: 14px;
      transition: border-color 160ms;
    }
    .form-row input:focus, .form-row select:focus {
      outline: 0; border-color: var(--text);
    }

    .btn {
      width: 100%; padding: 13px;
      background: var(--text); color: var(--bg);
      border: 0; border-radius: 8px;
      font-family: inherit; font-weight: 500; font-size: 14px;
      letter-spacing: 0.01em; cursor: pointer;
      transition: background 160ms;
    }
    .btn:hover { background: #2c2823; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--raiff); color: var(--text);
    }
    .btn.primary:hover { background: #fff04a; }

    .tx-list { display: flex; flex-direction: column; gap: 0; }
    .tx-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .tx-row:last-child { border-bottom: 0; }
    .tx-row .desc { font-size: 13px; }
    .tx-row .ts { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-row .amt { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
    .tx-row .amt.minus { color: var(--text); }
    .tx-row .amt.plus  { color: var(--good); }

    .empty {
      text-align: center; padding: 60px 0;
      color: var(--muted); font-size: 13px;
    }

    .alert {
      margin-top: 18px; padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px; line-height: 1.5;
    }
    .alert.ok    { background: #e8f0e2; color: var(--good); }
    .alert.info  { background: #f0e8d0; color: var(--warn); }
    .alert.error { background: #f4dfd6; color: var(--bad); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px;
      background: var(--surface); font-family: inherit; font-size: 13px;
      color: var(--text); cursor: pointer;
    }
    .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
    .hint { font-size: 12px; color: var(--text-2); margin: 4px 0 14px; line-height: 1.5; }
    .seg-badge {
      display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 999px;
      background: var(--raiff-soft); color: var(--text); margin-bottom: 10px;
    }
    .offer { margin-top: 18px; border: 1px solid var(--rule); border-radius: 10px; padding: 16px; }
    .offer .head { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
    .offer .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .offer .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .offer .v { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .offer .why { margin-top: 12px; font-size: 13px; color: var(--text-2); line-height: 1.5; }
    .offer.approved { border-color: var(--good); }
    .offer.approved .head { color: var(--good); }
    .offer.counter { border-color: var(--warn); }
    .offer.counter .head { color: var(--warn); }
    .offer.declined { border-color: var(--bad); }
    .offer.declined .head { color: var(--bad); }

    .product { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .product .pn { font-weight: 600; font-size: 15px; }
    .product .pr { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
    .product .row { display: flex; gap: 8px; margin-top: 12px; }
    .product .row input { flex: 1; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 6px;
      background: var(--bg); font-family: inherit; font-size: 14px; }
    .product .row .btn { width: auto; padding: 9px 14px; }

    .client-picker { padding: 14px 22px; border-bottom: 1px solid var(--rule); }
    .client-picker label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .client-picker select { width: 100%; margin-top: 4px; padding: 8px 10px;
      border: 1px solid var(--rule); background: var(--surface); border-radius: 6px;
      font-family: inherit; font-size: 13px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div><span class="logo"></span><span class="name">Райф</span></div>
      <div class="who" id="topbar-who"></div>
    </div>

    <div class="balance">
      <div class="l">остаток на счёте</div>
      <div class="v"><span id="balance-v">—</span><span class="cur">₽</span></div>
    </div>

    <div class="client-picker">
      <label>Профиль</label>
      <select id="client-select"></select>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="transfers">Переводы</button>
      <button class="tab" data-tab="credit">Кредит</button>
      <button class="tab" data-tab="products">Продукты</button>
    </div>

    <div class="tab-pane" data-pane="products">
      <div class="section-title">Для вас</div>
      <div id="product-list"></div>
      <div id="product-result"></div>
    </div>

    <div class="tab-pane" data-pane="credit">
      <div class="seg-badge" id="seg-badge"></div>
      <div class="section-title">Кредит наличными</div>
      <form id="credit-form" autocomplete="off">
        <div class="form-row">
          <label>Сумма, ₽</label>
          <input name="amount" type="number" min="1000" step="1000" placeholder="0" />
          <div class="chips" id="amount-chips"></div>
        </div>
        <div class="form-row">
          <label>Срок</label>
          <div class="chips" id="term-chips"></div>
          <input name="term" type="hidden" />
        </div>
        <div class="hint" id="credit-hint"></div>
        <button class="btn primary" type="submit">Получить решение</button>
      </form>
      <div id="credit-result"></div>
      <div class="section-title" style="margin-top:24px">Мои кредиты</div>
      <div id="my-credits" class="tx-list"></div>
      <div class="section-title" style="margin-top:24px">Мои заявки</div>
      <div id="credit-history" class="tx-list"></div>
    </div>

    <div class="tab-pane show" data-pane="transfers">
      <div class="section-title">Перевести</div>
      <form id="transfer-form" autocomplete="off">
        <div class="form-row">
          <label>Кому</label>
          <input name="to" placeholder="имя или ID получателя" />
        </div>
        <div class="form-row">
          <label>Сумма, ₽</label>
          <input name="amount" type="number" min="1" placeholder="0" />
        </div>
        <button class="btn primary" type="submit">Перевести</button>
      </form>
      <div id="transfer-result"></div>

      <div class="section-title" style="margin-top:24px">Последние операции</div>
      <div id="tx-list" class="tx-list"></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    const fmt = new Intl.NumberFormat("ru-RU");
    const sel = document.getElementById("client-select");
    const balanceV = document.getElementById("balance-v");
    const topbarWho = document.getElementById("topbar-who");
    const txList = document.getElementById("tx-list");
    const transferResult = document.getElementById("transfer-result");

    // ---- табы ----
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("show"));
        btn.classList.add("active");
        document.querySelector(`[data-pane="${btn.dataset.tab}"]`).classList.add("show");
      });
    });

    // ---- загрузка списка клиентов в селект ----
    async function loadClients() {
      try {
        const r = await fetch("/clients?limit=200");
        const d = await r.json();
        const items = (d.items || []).slice(0, 80);
        sel.innerHTML = items.map(c =>
          `<option value="${c.id}" data-balance="${c.balance_rub}" data-name="${c.name}" data-segment="${c.segment}">
            ${c.name}
          </option>`
        ).join("");
        if (items.length) onPickClient();
      } catch(e) { console.error(e); }
    }

    function onPickClient() {
      const opt = sel.selectedOptions[0];
      if (!opt) return;
      balanceV.textContent = fmt.format(+opt.dataset.balance || 0);
      topbarWho.textContent = opt.dataset.name;
      loadTx(opt.value);
      loadCreditPresets(opt.value);
      loadCreditHistory(opt.value);
      loadProducts(opt.value);
      loadMyCredits(opt.value);
    }
    sel.addEventListener("change", onPickClient);

    // ---- последние операции ----
    async function loadTx(clientId) {
      try {
        const r = await fetch(`/transactions/${clientId}?limit=10`);
        const d = await r.json();
        const items = d.items || [];
        if (!items.length) {
          txList.innerHTML = `<div class="empty">Операций пока нет</div>`;
          return;
        }
        txList.innerHTML = items.map(t => {
          const sign = t.amount_rub >= 0 ? "plus" : "minus";
          const amt = (t.amount_rub >= 0 ? "+" : "−") + fmt.format(Math.abs(t.amount_rub));
          const niceTs = t.ts.replace("T", " ").slice(0, 16);
          return `<div class="tx-row">
            <div>
              <div class="desc">${typeLabel(t.type)}</div>
              <div class="ts">${niceTs}</div>
            </div>
            <div class="amt ${sign}">${amt} ₽</div>
          </div>`;
        }).join("");
      } catch(e) {
        txList.innerHTML = `<div class="empty">Не удалось загрузить операции</div>`;
      }
    }

    function typeLabel(t) {
      return ({
        transfer_in:    "Перевод входящий",
        transfer_out:   "Перевод исходящий",
        card_purchase:  "Оплата картой",
        atm_withdraw:   "Снятие в банкомате",
        salary:         "Зарплата",
        utility_payment:"Коммунальные",
      })[t] || t;
    }

    function setBalance(newAmount) {
      balanceV.textContent = fmt.format(newAmount);
      const opt = sel.selectedOptions[0];
      if (opt) opt.dataset.balance = newAmount;
    }

    // ---- форма перевода ----
    const transferForm = document.getElementById("transfer-form");
    transferForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      transferResult.innerHTML = "";
      const opt = sel.selectedOptions[0];
      if (!opt) return;
      const data = new FormData(ev.target);
      const to = (data.get("to") || "").trim();
      const amount = +data.get("amount");
      if (!to || amount <= 0) {
        transferResult.innerHTML = `<div class="alert error">введи получателя и сумму</div>`;
        return;
      }

      const payload = {
        from_client_id: opt.value,
        to: to,
        amount_rub: amount,
      };
      try {
        const r = await fetch("/api/transfer", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (r.ok) {
          const kindLabel = d.kind === "internal"
            ? `${d.to} (клиент банка)`
            : `${d.to} (внешний счёт)`;
          transferResult.innerHTML =
            `<div class="alert ok">Отправлено ${fmt.format(d.amount_rub)} ₽<br/>
             получатель: ${kindLabel}</div>`;
          setBalance(d.new_balance_rub);
          transferForm.reset();
          loadTx(opt.value);
        } else {
          transferResult.innerHTML =
            `<div class="alert error">${d.detail || "ошибка"}</div>`;
        }
      } catch(e) {
        transferResult.innerHTML =
          `<div class="alert error">сервер не ответил</div>`;
      }
    });

    // ---- кредит ----
    const creditForm = document.getElementById("credit-form");
    const creditResult = document.getElementById("credit-result");
    const amountChips = document.getElementById("amount-chips");
    const termChips = document.getElementById("term-chips");
    const segBadge = document.getElementById("seg-badge");
    const creditHint = document.getElementById("credit-hint");
    const SEG_HINT = {
      mass: "Решение онлайн за минуту, без справок о доходе. Покажем платёж и полную стоимость заранее.",
      mass_affluent: "Для вас ставка и сумма подбираются по вашему профилю — больше лимит, лучше условия.",
    };

    function shortRub(n) {
      return n >= 1e6 ? (n / 1e6).toString().replace(".", ",") + " млн ₽"
                      : fmt.format(n / 1000) + " тыс ₽";
    }
    function termLabel(m) { return m % 12 === 0 ? `${m / 12} ${m === 12 ? "год" : (m <= 48 ? "года" : "лет")}` : `${m} мес`; }

    function pickChip(container, value) {
      container.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v == value));
    }

    async function loadCreditPresets(clientId) {
      creditResult.innerHTML = "";
      let p;
      try {
        const r = await fetch(`/api/credit-presets/${clientId}`);
        p = r.ok ? await r.json() : null;
      } catch(e) { p = null; }
      if (!p) p = { segment: "mass", segment_label: "", amounts: [50000, 150000, 300000],
                    terms: [12, 24, 36], default_amount: 150000, default_term: 24 };
      segBadge.textContent = p.segment_label ? `Ваш пакет: ${p.segment_label}` : "";
      segBadge.style.display = p.segment_label ? "inline-block" : "none";
      creditHint.textContent = SEG_HINT[p.segment] || SEG_HINT.mass;
      amountChips.innerHTML = p.amounts.map(a =>
        `<button type="button" class="chip" data-v="${a}">${shortRub(a)}</button>`).join("");
      termChips.innerHTML = p.terms.map(t =>
        `<button type="button" class="chip" data-v="${t}">${termLabel(t)}</button>`).join("");
      creditForm.amount.value = p.default_amount;
      creditForm.term.value = p.default_term;
      pickChip(amountChips, p.default_amount);
      pickChip(termChips, p.default_term);
    }

    amountChips.addEventListener("click", ev => {
      const c = ev.target.closest(".chip"); if (!c) return;
      creditForm.amount.value = c.dataset.v; pickChip(amountChips, c.dataset.v);
    });
    termChips.addEventListener("click", ev => {
      const c = ev.target.closest(".chip"); if (!c) return;
      creditForm.term.value = c.dataset.v; pickChip(termChips, c.dataset.v);
    });
    creditForm.amount.addEventListener("input", () => pickChip(amountChips, creditForm.amount.value));

    function renderOffer(d) {
      const head = {
        approved: "Кредит одобрен",
        counter:  "Можем одобрить на других условиях",
        declined: "Сейчас не можем одобрить",
      }[d.decision];
      if (!head) {
        return `<div class="alert info">${d.message || "Заявка принята. Решение пришлём в течение нескольких минут."}</div>`;
      }
      const cells = [];
      if (d.amount_rub)          cells.push(["Сумма", fmt.format(d.amount_rub) + " ₽"]);
      if (d.rate_pct != null)    cells.push(["Ставка", String(d.rate_pct).replace(".", ",") + "% годовых"]);
      if (d.term_months)         cells.push(["Срок", termLabel(d.term_months)]);
      if (d.monthly_payment_rub) cells.push(["Платёж в месяц", fmt.format(d.monthly_payment_rub) + " ₽"]);
      if (d.total_cost_rub)      cells.push(["Всего выплатите", fmt.format(d.total_cost_rub) + " ₽"]);
      const grid = d.decision === "declined" ? "" :
        `<div class="grid">${cells.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
      const why = [d.reason, d.alternative].filter(Boolean).join(" ");
      const take = d.decision === "declined" ? "" :
        `<button type="button" class="btn primary" id="credit-accept" style="margin-top:14px">Получить ${fmt.format(d.amount_rub)} ₽</button>`;
      return `<div class="offer ${d.decision}"><div class="head">${head}</div>${grid}${why ? `<div class="why">${why}</div>` : ""}${take}</div>`;
    }

    let lastOffer = null;
    creditResult.addEventListener("click", async ev => {
      if (!ev.target.closest("#credit-accept") || !lastOffer) return;
      const btn = ev.target.closest("#credit-accept");
      btn.disabled = true; btn.textContent = "Оформляем…";
      const o = lastOffer;
      try {
        const r = await fetch("/api/credit-accept", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ offer_id: o.offer_id }),
        });
        const d = await r.json();
        if (r.ok && d.status === "ok") {
          if (d.new_balance_rub != null) setBalance(d.new_balance_rub);
          creditResult.innerHTML = `<div class="alert ok">${d.message} +${fmt.format(d.amount_rub)} ₽</div>`;
          loadTx(o.client_id);
          loadMyCredits(o.client_id);
        } else {
          creditResult.innerHTML = `<div class="alert info">${d.message || d.detail || "Заявка принята"}</div>`;
        }
        lastOffer = null;
        loadCreditHistory(o.client_id);
      } catch(e) {
        btn.disabled = false; btn.textContent = "Попробовать ещё раз";
      }
    });

    const creditHistory = document.getElementById("credit-history");
    async function loadCreditHistory(clientId) {
      try {
        const r = await fetch(`/api/credit-applications/${clientId}`);
        const d = await r.json();
        const items = d.items || [];
        creditHistory.innerHTML = items.length ? items.map(a => `<div class="tx-row">
            <div><div class="desc">${fmt.format(a.amount_rub)} ₽ · ${termLabel(a.term_months)}</div>
            <div class="ts">${(a.created_at || "").replace("T", " ").slice(0, 16)}</div></div>
            <div class="amt">${a.label || ""}</div>
          </div>`).join("") : `<div class="empty">Заявок пока нет</div>`;
      } catch(e) { creditHistory.innerHTML = `<div class="empty">Заявок пока нет</div>`; }
    }

    creditForm.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const opt = sel.selectedOptions[0];
      if (!opt) return;
      const amount = +creditForm.amount.value;
      const term = +creditForm.term.value;
      if (!(amount > 0) || !(term > 0)) {
        creditResult.innerHTML = `<div class="alert error">Укажите сумму и срок</div>`;
        return;
      }
      creditResult.innerHTML = `<div class="alert info">Считаем решение…</div>`;
      try {
        const r = await fetch("/api/credit-apply", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ client_id: opt.value, amount_rub: amount, term_months: term }),
        });
        const d = await r.json();
        lastOffer = (r.ok && (d.decision === "approved" || d.decision === "counter")) ? d : null;
        if (r.ok) loadCreditHistory(opt.value);
        creditResult.innerHTML = r.ok ? renderOffer(d)
          : `<div class="alert error">${d.detail || "Не получилось отправить заявку"}</div>`;
      } catch(e) {
        creditResult.innerHTML = `<div class="alert error">Сервис временно недоступен, попробуйте через минуту</div>`;
      }
    });

    // ---- мои кредиты ----
    const myCredits = document.getElementById("my-credits");
    async function loadMyCredits(clientId) {
      try {
        const r = await fetch(`/api/my-credits/${clientId}`);
        const d = await r.json();
        const items = d.items || [];
        if (!items.length) { myCredits.innerHTML = `<div class="empty">Открытых кредитов нет</div>`; return; }
        myCredits.innerHTML = items.map(c => `<div class="tx-row">
            <div><div class="desc">${c.name} · ${String(c.rate_pct).replace(".", ",")}%</div>
            <div class="ts">${fmt.format(c.principal_rub)} ₽ · осталось ${c.months_left} мес${c.overdue ? " · была просрочка" : ""}</div></div>
            <div class="amt">${fmt.format(c.monthly_payment_rub)} ₽/мес</div></div>`).join("")
          + `<div class="hint" style="margin-top:8px">Всего платежей в месяц: ${fmt.format(d.monthly_total_rub)} ₽</div>`;
      } catch(e) { myCredits.innerHTML = `<div class="empty">Не удалось загрузить кредиты</div>`; }
    }

    // ---- продукты (каталог cib) ----
    const productList = document.getElementById("product-list");
    const productResult = document.getElementById("product-result");
    const KIND_TEXT = {
      credit:  p => `Ставка от ${String(p.rate_pct ?? "").replace(".", ",")}% · решение за минуту`,
      deposit: p => `${String(p.rate_pct ?? "").replace(".", ",")}% годовых`,
      card:    p => "Бесплатное обслуживание · переводы без комиссии",
    };
    function openTab(name) { document.querySelector(`.tab[data-tab="${name}"]`).click(); }

    async function loadProducts(clientId) {
      productResult.innerHTML = "";
      try {
        const r = await fetch(`/api/products?client_id=${encodeURIComponent(clientId)}`);
        const d = await r.json();
        const items = d.items || [];
        if (!items.length) { productList.innerHTML = `<div class="empty">Каталог скоро появится</div>`; return; }
        productList.innerHTML = items.map(p => {
          const sub = (KIND_TEXT[p.kind] || (() => p.rate_pct ? `${p.rate_pct}%` : ""))(p);
          let action = "";
          if (p.kind === "credit") action = `<div class="row"><button type="button" class="btn primary" data-act="credit">Оформить</button></div>`;
          if (p.kind === "deposit") action = `<div class="row"><input type="number" min="1000" step="1000" placeholder="Сумма, ₽" data-amt="${p.id}" />
              <button type="button" class="btn primary" data-act="deposit" data-id="${p.id}" data-rate="${p.rate_pct ?? ""}">Открыть вклад</button></div>`;
          return `<div class="product"><div class="pn">${p.name}</div><div class="pr">${sub}</div>${action}</div>`;
        }).join("");
      } catch(e) { productList.innerHTML = `<div class="empty">Каталог временно недоступен</div>`; }
    }

    productList.addEventListener("click", async ev => {
      const b = ev.target.closest("button[data-act]"); if (!b) return;
      if (b.dataset.act === "credit") { openTab("credit"); return; }
      const opt = sel.selectedOptions[0]; if (!opt) return;
      const amt = +(productList.querySelector(`input[data-amt="${b.dataset.id}"]`).value || 0);
      if (amt < 1000) { productResult.innerHTML = `<div class="alert error">Минимальная сумма вклада — 1 000 ₽</div>`; return; }
      b.disabled = true;
      try {
        const r = await fetch("/api/deposit-open", { method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ client_id: opt.value, product_id: b.dataset.id, amount_rub: amt, rate_pct: +b.dataset.rate || null }) });
        const d = await r.json();
        if (r.ok && d.status === "ok") {
          if (d.new_balance_rub != null) setBalance(d.new_balance_rub);
          productResult.innerHTML = `<div class="alert ok">${d.message} ${fmt.format(d.amount_rub)} ₽</div>`;
          loadTx(opt.value);
        } else {
          productResult.innerHTML = `<div class="alert ${r.ok ? "info" : "error"}">${d.message || d.detail || "Не получилось"}</div>`;
        }
      } catch(e) { productResult.innerHTML = `<div class="alert error">Сервис временно недоступен</div>`; }
      b.disabled = false;
    });

    loadClients();
  })();
  </script>
</body>
</html>
